name: Extract Fixed User App v1.4

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract user_app from v1.4
        run: |
          set -e

          ZIP="zen_mining_production_build_fixed_v1_4.zip"

          test -f "$ZIP"

          rm -rf /tmp/zen_extract
          mkdir -p /tmp/zen_extract

          unzip -q "$ZIP" -d /tmp/zen_extract

          SOURCE="/tmp/zen_extract/zen_mining_production_v1_4/user_app"

          test -d "$SOURCE"
          test -f "$SOURCE/pubspec.yaml"
          test -f "$SOURCE/android/app/src/main/AndroidManifest.xml"

          rm -rf user_app
          cp -a "$SOURCE" user_app

          echo "Fixed user_app extracted successfully."

      - name: Verify fixed Android project
        run: |
          set -e

          test -f user_app/pubspec.yaml
          test -f user_app/lib/main.dart
          test -f user_app/android/settings.gradle.kts
          test -f user_app/android/app/build.gradle.kts
          test -f user_app/android/gradle/wrapper/gradle-wrapper.properties
          test -f user_app/android/app/src/main/res/values/styles.xml
          test -f user_app/android/app/src/main/res/drawable/launch_background.xml
          test -f user_app/android/app/src/main/kotlin/com/zenmining/app/MainActivity.kt
          test -f user_app/android/app/src/main/kotlin/com/zenmining/app/UsageMonitorService.kt
          test -f user_app/android/app/src/main/kotlin/com/zenmining/app/BootReceiver.kt

          echo "All fixed user_app files verified."

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add user_app

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update user_app to production fixed v1.4"
          git push
