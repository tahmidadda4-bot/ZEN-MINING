name: ZEN MINING Final Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Verify secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

      - name: Verify project
        working-directory: user_app
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/values/styles.xml
          test -f android/app/src/main/res/drawable/launch_background.xml
          test -f android/app/src/main/kotlin/com/zenmining/app/MainActivity.kt
          test -f android/app/src/main/kotlin/com/zenmining/app/BootReceiver.kt
          test -f android/app/src/main/kotlin/com/zenmining/app/UsageMonitorService.kt

      - name: Check Flutter embedding
        working-directory: user_app
        run: |
          set -e

          if grep -R -n \
            -e "io.flutter.app" \
            -e "FlutterApplication" \
            -e "FlutterActivityDelegate" \
            -e 'flutterEmbedding.*android:value="1"' \
            android \
            --include="*.kt" \
            --include="*.java" \
            --include="*.xml"; then
            echo "ERROR: Flutter V1 embedding found."
            exit 1
          fi

          grep -q 'android:value="2"' android/app/src/main/AndroidManifest.xml
          grep -q 'io.flutter.embedding.android.FlutterActivity' android/app/src/main/kotlin/com/zenmining/app/MainActivity.kt

      - name: Install dependencies
        working-directory: user_app
        run: flutter pub get

      - name: Analyze Dart
        working-directory: user_app
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: user_app
        run: |
          set -e

          if [ -d "test" ]; then
            flutter test
          else
            echo "No test directory found. Skipping Flutter tests."
          fi

      - name: Clean project
        working-directory: user_app
        run: flutter clean

      - name: Restore dependencies
        working-directory: user_app
        run: flutter pub get

      - name: Build APK
        working-directory: user_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

          APK="$(find build/app/outputs -type f -name 'app-release.apk' | head -n 1)"

          test -n "$APK"
          test -s "$APK"

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Build AAB
        working-directory: user_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

          AAB="$(find build/app/outputs -type f -name 'app-release.aab' | head -n 1)"

          test -n "$AAB"
          test -s "$AAB"

          echo "AAB BUILD SUCCESSFUL"
          ls -lh "$AAB"

      - name: Final verification
        working-directory: user_app
        run: |
          set -e

          APK="$(find build/app/outputs -type f -name 'app-release.apk' | head -n 1)"
          AAB="$(find build/app/outputs -type f -name 'app-release.aab' | head -n 1)"

          test -s "$APK"
          test -s "$AAB"

          echo "================================"
          echo " ZEN MINING BUILD VERIFIED"
          echo "================================"
          echo "APK:"
          ls -lh "$APK"
          echo "AAB:"
          ls -lh "$AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zen-mining-release-apk
          path: user_app/build/app/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: zen-mining-release-aab
          path: user_app/build/app/outputs/**/*.aab
          if-no-files-found: error
          retention-days: 14
