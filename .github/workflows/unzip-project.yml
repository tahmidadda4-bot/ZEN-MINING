name: Extract ZEN MINING Production Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    name: Extract Production ZIP
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Find the uploaded ZIP
      # --------------------------------------------------
      - name: Find production ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for:"
          echo "zen_mining_production_v1_1.zip"
          echo

          ZIP_FILE="$(find . \
            -type f \
            -name 'zen_mining_production_v1_1.zip' \
            -not -path './.git/*' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file was not found."
            echo
            echo "Files currently in repository:"
            find . \
              -maxdepth 4 \
              -type f \
              -not -path './.git/*' \
              | sort
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 3. Verify ZIP integrity
      # --------------------------------------------------
      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -e

          echo "Testing ZIP:"
          echo "$ZIP_FILE"
          echo

          unzip -t "$ZIP_FILE"

          echo
          echo "ZIP integrity check PASSED."


      # --------------------------------------------------
      # 4. Extract ZIP
      # --------------------------------------------------
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf _zen_extract
          mkdir -p _zen_extract

          unzip -q "$ZIP_FILE" -d _zen_extract

          echo "ZIP extraction completed."


      # --------------------------------------------------
      # 5. Detect the actual project root
      # --------------------------------------------------
      - name: Detect project root
        shell: bash
        run: |
          set -e

          echo "Extracted content:"
          echo "------------------"

          find _zen_extract \
            -maxdepth 3 \
            -print \
            | sort

          echo
          echo "Detecting project root..."

          TOP_DIRS="$(find _zen_extract \
            -mindepth 1 \
            -maxdepth 1 \
            -type d)"

          TOP_FILES="$(find _zen_extract \
            -mindepth 1 \
            -maxdepth 1 \
            -type f)"

          DIR_COUNT="$(printf '%s\n' "$TOP_DIRS" \
            | sed '/^$/d' \
            | wc -l)"

          FILE_COUNT="$(printf '%s\n' "$TOP_FILES" \
            | sed '/^$/d' \
            | wc -l)"

          if [ "$DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_ROOT="$(printf '%s\n' "$TOP_DIRS" | head -n 1)"
          else
            PROJECT_ROOT="_zen_extract"
          fi

          echo
          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 6. Validate the actual ZIP structure
      # --------------------------------------------------
      - name: Validate ZIP project structure
        shell: bash
        run: |
          set -e

          echo "Validating extracted project..."

          test -d "$PROJECT_ROOT/user_app"
          test -f "$PROJECT_ROOT/user_app/pubspec.yaml"

          test -d "$PROJECT_ROOT/admin_web"
          test -f "$PROJECT_ROOT/admin_web/index.html"

          test -d "$PROJECT_ROOT/supabase"
          test -f "$PROJECT_ROOT/supabase/config.toml"

          test -d "$PROJECT_ROOT/database"
          test -f "$PROJECT_ROOT/database/PRODUCTION.sql"

          test -d "$PROJECT_ROOT/assets"
          test -d "$PROJECT_ROOT/docs"

          test -f "$PROJECT_ROOT/README.md"
          test -f "$PROJECT_ROOT/VERSION.txt"

          echo
          echo "ZIP PROJECT STRUCTURE: VALID"


      # --------------------------------------------------
      # 7. Copy project to repository root
      # --------------------------------------------------
      - name: Install project into repository
        shell: bash
        run: |
          set -e

          echo "Copying production project..."

          cp -a "$PROJECT_ROOT"/. .

          echo "Project copied successfully."


      # --------------------------------------------------
      # 8. Rename admin_web → admin_panel
      # --------------------------------------------------
      - name: Normalize admin panel name
        shell: bash
        run: |
          set -e

          if [ -d "admin_web" ]; then

            rm -rf admin_panel

            mv admin_web admin_panel

            echo "admin_web renamed to admin_panel."

          elif [ -d "admin_panel" ]; then

            echo "admin_panel already exists."

          else

            echo "ERROR: Admin panel directory not found."
            exit 1

          fi


      # --------------------------------------------------
      # 9. Remove temporary extraction directory
      # --------------------------------------------------
      - name: Cleanup
        shell: bash
        run: |
          rm -rf _zen_extract

          echo "Temporary extraction files removed."


      # --------------------------------------------------
      # 10. Final validation
      # --------------------------------------------------
      - name: Final project validation
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " FINAL ZEN MINING PROJECT VALIDATION"
          echo "=========================================="

          test -d user_app
          test -f user_app/pubspec.yaml

          test -d admin_panel
          test -f admin_panel/index.html

          test -d supabase
          test -f supabase/config.toml

          test -d database
          test -f database/PRODUCTION.sql

          test -d assets
          test -d docs

          test -f README.md
          test -f VERSION.txt

          echo
          echo "ALL REQUIRED PROJECT COMPONENTS: PASS"


      # --------------------------------------------------
      # 11. Display final structure
      # --------------------------------------------------
      - name: Show final project structure
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo " FINAL PROJECT STRUCTURE"
          echo "=========================================="

          find . \
            -maxdepth 3 \
            -not -path './.git/*' \
            -not -path './zen_mining_production_v1_1.zip' \
            -print \
            | sort


      # --------------------------------------------------
      # 12. Commit everything
      # --------------------------------------------------
      - name: Commit extracted project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "No changes detected."
            echo "Nothing to commit."

          else

            git commit \
              -m "Extract ZEN MINING production project"

            git push

            echo "Project committed and pushed successfully."

          fi
