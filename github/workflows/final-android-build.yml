name: ZEN MINING Final Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Verify secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

      - name: Verify project
        working-directory: user_app
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f lib/main.dart

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/values/styles.xml
          test -f android/app/src/main/res/drawable/launch_background.xml

          test -f android/app/src/main/kotlin/com/zenmining/app/MainActivity.kt
          test -f android/app/src/main/kotlin/com/zenmining/app/BootReceiver.kt
          test -f android/app/src/main/kotlin/com/zenmining/app/UsageMonitorService.kt

      - name: Configure built-in Kotlin
        working-directory: user_app
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/gradle.properties")
          s = p.read_text()

          def set_prop(text, key, value):
              lines = text.splitlines()
              found = False
              out = []

              for line in lines:
                  if line.startswith(key + "="):
                      if not found:
                          out.append(f"{key}={value}")
                          found = True
                  else:
                      out.append(line)

              if not found:
                  out.append(f"{key}={value}")

              return "\n".join(out) + "\n"

          s = set_prop(s, "android.builtInKotlin", "true")
          s = set_prop(s, "android.newDsl", "false")

          p.write_text(s)

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          old = """    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
"""

          new = """kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
"""

          if old in s:
              s = s.replace(old, new)

          p.write_text(s)
          PY

          echo "Final Android Kotlin configuration:"
          cat android/gradle.properties
          echo
          cat android/app/build.gradle.kts

      - name: Reject Flutter V1 embedding
        working-directory: user_app
        run: |
          set -euo pipefail

          if grep -R -n \
            -e "io.flutter.app" \
            -e "FlutterApplication" \
            -e "FlutterActivityDelegate" \
            -e 'flutterEmbedding.*android:value="1"' \
            android \
            --include="*.kt" \
            --include="*.java" \
            --include="*.xml"; then
            echo "ERROR: Flutter V1 embedding reference found."
            exit 1
          fi

          grep -q 'android:value="2"' \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            'io.flutter.embedding.android.FlutterActivity' \
            android/app/src/main/kotlin/com/zenmining/app/MainActivity.kt

      - name: Install dependencies
        working-directory: user_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: user_app
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: user_app
        run: flutter test

      - name: Clean
        working-directory: user_app
        run: flutter clean

      - name: Get dependencies again
        working-directory: user_app
        run: flutter pub get

      - name: Build APK
        working-directory: user_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

          APK="$(find build/app/outputs -type f -name 'app-release.apk' | head -n 1)"

          test -n "$APK"
          test -s "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Build AAB
        working-directory: user_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

          AAB="$(find build/app/outputs -type f -name 'app-release.aab' | head -n 1)"

          test -n "$AAB"
          test -s "$AAB"

          echo "AAB successfully created:"
          ls -lh "$AAB"

      - name: Final artifact verification
        working-directory: user_app
        run: |
          set -euo pipefail

          APK="$(find build/app/outputs -type f -name 'app-release.apk' | head -n 1)"
          AAB="$(find build/app/outputs -type f -name 'app-release.aab' | head -n 1)"

          test -s "$APK"
          test -s "$AAB"

          echo "========== FINAL BUILD VERIFIED =========="
          echo "APK: $APK"
          echo "AAB: $AAB"
          ls -lh "$APK" "$AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zen-mining-release-apk
          path: user_app/build/app/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: zen-mining-release-aab
          path: user_app/build/app/outputs/**/*.aab
          if-no-files-found: error
          retention-days: 14
